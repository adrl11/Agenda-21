<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas with Safe Padding -->
  <rect width="512" height="512" rx="104" fill="url(#blueGrad)" />
  
  <!-- Decorative Grid / Glow -->
  <circle cx="420" cy="90" r="140" fill="#60a5fa" opacity="0.15" />
  <circle cx="80" cy="440" r="120" fill="#38bdf8" opacity="0.1" />

  <!-- Main Agenda Book / Document Icon -->
  <g filter="url(#dropShadow)">
    <!-- Binder spine -->
    <rect x="100" y="96" width="312" height="320" rx="28" fill="#ffffff" />
    <path d="M100 96 H160 V416 H100 Z" fill="#0284c7" />
    
    <!-- Spine Rings -->
    <rect x="88" y="140" width="32" height="12" rx="6" fill="#cbd5e1" />
    <rect x="88" y="210" width="32" height="12" rx="6" fill="#cbd5e1" />
    <rect x="88" y="280" width="32" height="12" rx="6" fill="#cbd5e1" />
    <rect x="88" y="350" width="32" height="12" rx="6" fill="#cbd5e1" />
    
    <!-- Agenda Lines & 21 Badge -->
    <!-- Graduation Cap / Bookmark top emblem -->
    <path d="M280 145 L345 175 L280 205 L215 175 Z" fill="#1e40af" />
    <polygon points="345,175 345,210 340,215 340,178" fill="#0284c7" />
    <circle cx="345" cy="220" r="4" fill="#f59e0b" />
    
    <!-- Big 21 Badge -->
    <circle cx="280" cy="290" r="62" fill="url(#accentGrad)" />
    <text x="280" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">21</text>
    
    <!-- Subtitle / Checkmark -->
    <text x="280" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="3">AGENDA GURU</text>
  </g>
</svg>
